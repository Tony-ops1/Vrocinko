<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <title>Vročinko – obnova</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box}
    .card{max-width:460px;width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:24px;box-shadow:0 8px 28px rgba(15,23,42,.08);text-align:center}
    h1{font-size:26px;margin:0 0 10px}.msg{color:#667085;line-height:1.5}
  </style>
</head>
<body>
  <div class="card"><h1>Obnavljam Vročinko …</h1><div id="msg" class="msg">Brišem samo stari spletni predpomnilnik. Vaši vnosi in prijava ostanejo shranjeni.</div></div>
  <script>
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
        location.replace('./?recovery='+Date.now());
      }catch(e){
        document.getElementById('msg').textContent='Predpomnilnika ni bilo mogoče samodejno počistiti. Zaprite Vročinko in jo ponovno odprite.';
      }
    })();
  </script>
</body>
</html>
